name: Deploy Nico's Food

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'migrations/**'
      - 'public/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Cloudflare configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN as a repository secret."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set CLOUDFLARE_ACCOUNT_ID as a repository variable."
            exit 1
          fi
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const config = JSON.parse(readFileSync('wrangler.jsonc', 'utf8'));
          const databaseId = config.d1_databases?.find(({ binding }) => binding === 'DB')?.database_id;
          if (!databaseId || databaseId === '00000000-0000-0000-0000-000000000001') {
            console.error('::error::Replace the placeholder D1 database_id in wrangler.jsonc with the real Cloudflare database ID.');
            process.exit(1);
          }

          const imageBucket = config.r2_buckets?.find(({ binding }) => binding === 'IMAGES')?.bucket_name;
          if (!imageBucket) {
            console.error('::error::Configure the IMAGES R2 bucket binding in wrangler.jsonc.');
            process.exit(1);
          }
          NODE

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply nicos-food-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Pages and Functions
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}